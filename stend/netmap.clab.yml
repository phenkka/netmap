name: netmap

mgmt:
  network: netmap-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:latest
      startup-config: nokia/lldp.cfg
    linux:
      image: alpine:3.20

  nodes:
    core1:
      kind: nokia_srlinux
      mgmt-ipv4: 172.20.20.11
      exec:
        - ip link set dev mgmt0 address 90:EC:E3:00:00:11
    acc1:
      kind: nokia_srlinux
      mgmt-ipv4: 172.20.20.12
      exec:
        - ip link set dev mgmt0 address 90:EC:E3:00:00:12
    acc2:
      kind: nokia_srlinux
      mgmt-ipv4: 172.20.20.13
      exec:
        - ip link set dev mgmt0 address 90:EC:E3:00:00:13

    edge1:
      kind: linux
      image: netmap-frr:latest
      mgmt-ipv4: 172.20.20.21
    edge2:
      kind: linux
      image: netmap-frr:latest
      mgmt-ipv4: 172.20.20.22

    ap1:
      kind: linux
      image: netmap-openwrt:latest
      mgmt-ipv4: 172.20.20.31
    ap2:
      kind: linux
      image: netmap-openwrt:latest
      mgmt-ipv4: 172.20.20.32

    pc1:
      kind: linux
      mgmt-ipv4: 172.20.20.101
    pc2:
      kind: linux
      mgmt-ipv4: 172.20.20.102

  links:
    - endpoints: ["core1:ethernet-1/1", "acc1:ethernet-1/1"]
    - endpoints: ["core1:ethernet-1/2", "acc2:ethernet-1/1"]
    - endpoints: ["core1:ethernet-1/3", "edge1:eth1"]
    - endpoints: ["core1:ethernet-1/4", "edge2:eth1"]
    - endpoints: ["acc1:ethernet-1/2", "acc2:ethernet-1/2"]
    - endpoints: ["acc1:ethernet-1/3", "pc1:eth1"]
    - endpoints: ["acc1:ethernet-1/4", "ap1:eth1"]
    - endpoints: ["acc2:ethernet-1/3", "pc2:eth1"]
    - endpoints: ["acc2:ethernet-1/4", "ap2:eth1"]
