name: netmap

mgmt:
  network: netmap-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:latest
      # Объявление адреса управления в LLDP. У SR Linux оно выключено по
      # умолчанию, а без него сосед опознаётся только по имени, то есть уже
      # после входа на него. Настоящее оборудование в сети управления обычно
      # объявляет адрес, поэтому стенд ведёт себя так же.
      startup-config: lldp.partial.cfg
    linux:
      image: alpine:3.20

  nodes:
    # MAC-адреса задаются из диапазона Nokia 90:EC:E3 по реестру IEEE.
    # По умолчанию контейнер получает адрес Docker, по нему производителя
    # не определить, а продукт узнаёт вендора по MAC ещё до входа.
    core1:
      kind: nokia_srlinux
      mgmt-ipv4: 172.20.20.11
      exec:
        - ip link set dev mgmt0 address 90:EC:E3:00:00:11
    acc1:
      kind: nokia_srlinux
      mgmt-ipv4: 172.20.20.12
      exec:
        - ip link set dev mgmt0 address 90:EC:E3:00:00:12
    acc2:
      kind: nokia_srlinux
      mgmt-ipv4: 172.20.20.13
      exec:
        - ip link set dev mgmt0 address 90:EC:E3:00:00:13
    pc1:
      kind: linux
      mgmt-ipv4: 172.20.20.101
    pc2:
      kind: linux
      mgmt-ipv4: 172.20.20.102

  links:
    - endpoints: ["core1:ethernet-1/1", "acc1:ethernet-1/1"]
    - endpoints: ["core1:ethernet-1/2", "acc2:ethernet-1/1"]
    - endpoints: ["acc1:ethernet-1/2", "acc2:ethernet-1/2"]
    - endpoints: ["acc1:ethernet-1/3", "pc1:eth1"]
    - endpoints: ["acc2:ethernet-1/3", "pc2:eth1"]
