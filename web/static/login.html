<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>netmap</title>
<link rel="icon" href="/static/favicon.svg">
<script>
  try {
    var saved = localStorage.getItem("netmap-theme") || "system";
    var light = saved === "light" ||
      (saved === "system" && matchMedia("(prefers-color-scheme: light)").matches);
    if (light) document.documentElement.setAttribute("data-theme", "light");
  } catch (e) {}
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="entrance">

<div id="backdrop" aria-hidden="true">
  <header>
    <span class="brand">netmap</span>
    <span class="mock-field"></span>
  </header>
  <main>
    <aside>
      <span class="mock-row head"></span>
      <span class="mock-row"></span>
      <span class="mock-row"></span>
      <span class="mock-row"></span>
    </aside>
    <section id="map"></section>
  </main>
</div>

<div id="veil"></div>

<form id="enter">
  <span class="brand">netmap</span>
  <p id="hint">Авторизация</p>
  <input id="login" placeholder="Логин" autocomplete="username" spellcheck="false" required>
  <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
  <button type="submit" id="go">Войти</button>
  <button type="button" id="forgot" class="link" hidden>Забыли пароль?</button>
  <div id="problem"></div>
</form>

<form id="restore" novalidate hidden>
  <span class="brand">netmap</span>
  <p class="lead">Ключ восстановления выдавался при первом запуске. Он откроет
    доступы к оборудованию и задаст новый пароль администратору.</p>
  <input id="r-login" placeholder="Логин" autocomplete="username" spellcheck="false">
  <input id="r-key" placeholder="Ключ восстановления" spellcheck="false">
  <input id="r-password" type="password" placeholder="Новый пароль"
         autocomplete="new-password">
  <button type="submit" id="r-go">Задать пароль и войти</button>
  <button type="button" id="cancel" class="link">Обычный вход</button>
  <div id="r-problem"></div>
</form>

<script type="module" src="/static/js/login.js"></script>
</body>
</html>
